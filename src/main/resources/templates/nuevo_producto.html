<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Producto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        label { display: block; margin-top: 10px; }
        input[type="text"], input[type="number"], select { width: 90%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
<div class="container">
    <h2>Registrar Nuevo Producto</h2>
    
    <form th:action="@{/productos/guardar}" th:object="${producto}" method="post">
        
        <label for="nombre">Nombre del Producto:</label>
        <input type="text" id="nombre" th:field="*{nombre}" required>

        <label for="stock">Stock Inicial:</label>
        <input type="number" id="stock" th:field="*{stock}" required min="0">
        
        <label for="precio">Precio Unitario (ARS$):</label>
        <input type="number" id="precio" th:field="*{precio}" required step="0.01" min="0">

        <label for="proveedor">Proveedor:</label>
        <select id="proveedor" th:field="*{proveedor}" required>
            <option value="">-- Seleccione Proveedor --</option>
            <option th:each="p : ${listaProveedores}" 
                    th:value="${p.id}" 
                    th:text="${p.nombre}">
                Proveedor Nombre
            </option>
        </select>

        <button type="submit">Guardar Producto</button>
    </form>
    <br>
    <a th:href="@{/}">Volver a la Lista de Productos</a>
</div>
</body>
</html>
