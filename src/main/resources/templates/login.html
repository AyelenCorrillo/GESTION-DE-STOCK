<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Iniciar Sesión</title>
    <style>
        /* Estilos básicos para centrar el formulario */
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; }
        .login-container { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        h2 { margin-bottom: 20px; color: #333; }
        label { display: block; text-align: left; margin-top: 10px; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background-color: #007bff; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="login-container">
    <h2>Acceso a Inventario</h2>
    
    <form method="POST" th:action="@{/login}">
        
        <div th:if="${param.error}" class="error">
            Usuario o contraseña inválidos.
        </div>
        
        <label for="username">Usuario:</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>

        <button type="submit">Iniciar Sesión</button>
    </form>
    <p style="margin-top: 20px; font-size: 0.9em;">
        Prueba con: <b>admin/password</b> (Acceso Total) o <b>user/password</b> (Solo Lectura)
    </p>
</div>
</body>
</html>
